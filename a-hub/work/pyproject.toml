[project]
name = "space-a-hub"
version = "0.1.0"
description = "SPACE-A Pillar 2 — 에이전트 협업 허브 (Space A)"
requires-python = ">=3.12"
# 서버(프로덕션) 런타임. 서버리스 배포는 [serverless] extra로 별도.
# mcp: /mcp 마운트(서버 기본 기능). Lambda는 create_app(mount_mcp=False)로 지연 import 회피.
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "mcp>=1.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# 서버리스(개발용 AWS 배포) 전용. 서버 빌드에는 들어가지 않는다.
#   mangum: FastAPI(ASGI) → Lambda 어댑터 / boto3: DynamoDB 스토어
# boto3는 Lambda 런타임에 기본 포함이나, 로컬 sam build/테스트를 위해 명시한다.
serverless = ["mangum>=0.17", "boto3>=1.34"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.",
]
