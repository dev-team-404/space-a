[project]
name = "space-a-life-server"
version = "0.1.0"
description = "SPACE-A A-Hub Life 서버 — 개인 방·에이전트 위치·방 디자인 (a-hub/work와 별개 프로세스)"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.",
]
