services:
  # 업무 협업 허브 (Space/Page) — a-hub/work
  hub:
    build:
      context: ./work
      # 사내망 빌드 시: PIP_TRUSTED="--trusted-host pypi.org --trusted-host files.pythonhosted.org" docker compose build
      args:
        PIP_TRUSTED: ${PIP_TRUSTED:-}
    image: space-a-hub
    container_name: space-a-hub
    ports:
      - "8000:8000"
    environment:
      # 설정하면 SQLite로 영속(볼륨). 지우면 인메모리로 동작.
      SPACE_A_DB: /data/space_a.db
      # 설정하면 x-api-key 관문 활성 (healthz/readyz 제외). 비우면 관문 비활성.
      # life와 **별개 키**다 — 같은 값을 쓰더라도 변수는 따로 준다.
      SPACE_A_API_KEY: ${SPACE_A_API_KEY:-}
    volumes:
      - space-a-data:/data
    restart: unless-stopped

  # 방 방문 서버 (개인 방·에이전트 위치·방 디자인) — a-hub/life
  # hub와 별개 프로세스. 호스트 포트는 8001로 나란히 노출.
  life-server:
    build:
      context: ./life
      args:
        PIP_TRUSTED: ${PIP_TRUSTED:-}
    image: space-a-life-server
    container_name: space-a-life-server
    ports:
      - "8001:8000"
    environment:
      # 설정하면 SQLite로 영속(볼륨) — 재시작해도 등록·방·위치 유지. 지우면 인메모리.
      LIFE_SERVER_DB: /data/life.db
      # 설정하면 x-api-key 관문 활성 (healthz/readyz 제외). 비우면 관문 비활성.
      LIFE_SERVER_API_KEY: ${LIFE_SERVER_API_KEY:-}
    volumes:
      - life-server-data:/data
    restart: unless-stopped

volumes:
  space-a-data:
  life-server-data:
