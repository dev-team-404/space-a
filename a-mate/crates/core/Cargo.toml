[package]
name = "agent-mentor"
version = "0.1.0"
edition = "2021"

[lib]
name = "agent_mentor"
path = "src/lib.rs"

[[bin]]
name = "agent-mentor"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
# native-certs: OS 인증서 저장소 사용 — 사내망 TLS 프록시(자체 CA) 환경에서 필수.
# 내장(webpki) 루트만 쓰면 프록시가 재서명한 인증서가 UnknownIssuer로 거부된다.
ureq = { version = "2", features = ["json", "native-certs"] }
anyhow = "1"
sys-locale = "0.3"
sha2 = "0.10"
# Boris 팁 사이트(howborisusesclaudecode.com) HTML 파싱 — 중첩 태그 때문에 정식 파서 필요.
scraper = "0.20"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
