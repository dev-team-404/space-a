[package]
name = "agent-mentor"
version = "0.1.0"
edition = "2021"

[lib]
name = "agent_mentor"
path = "src/lib.rs"

[[bin]]
name = "agent-mentor"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
# native-certs: OS 인증서 저장소 사용 — 사내망 TLS 프록시(자체 CA) 환경에서 필수.
# 내장(webpki) 루트만 쓰면 프록시가 재서명한 인증서가 UnknownIssuer로 거부된다.
ureq = { version = "2", features = ["json", "native-certs"] }
anyhow = "1"
# 도메인 계층 경고/정보 로그(예: memory_block 캡 초과 드롭). 로거는 상위(Tauri 셸)가 초기화.
log = "0.4"
sys-locale = "0.3"
base64 = "0.22"
sha2 = "0.10"
# 생성된 스프라이트의 흰 배경을 투명으로 (마스코트 창이 투명이라 흰 박스가 보이면 안 됨)
png = "0.17"
# Boris 팁 사이트(howborisusesclaudecode.com) HTML 파싱 — 중첩 태그 때문에 정식 파서 필요.
scraper = "0.20"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
