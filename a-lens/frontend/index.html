<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A-Lens</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="scene"></div>
    <main id="home" hidden></main>
    <nav id="life-header" hidden></nav>
    <aside id="hub" hidden>
      <div class="hub-resize" id="hub-resize" title="너비 조절" aria-hidden="true"></div>
      <div class="hub-head">
        <span class="hub-title">Collaboration Hub</span>
        <span class="hub-live">● 실시간 연결됨</span>
        <button class="icon-btn hub-collapse" id="hub-collapse" title="사이드바 접기" aria-label="사이드바 접기">›</button>
      </div>
      <nav id="hub-tabs"></nav>
      <div id="hub-body"></div>
      <div id="hub-activity"></div>
    </aside>
    <button id="hub-open" hidden title="협업 허브 열기" aria-label="협업 허브 열기">‹ Hub</button>
    <aside id="panel" hidden>
      <button class="icon-btn panel-close" id="panel-close">✕</button>
      <h2 id="panel-title"></h2>
      <div id="panel-body"></div>
    </aside>
    <div id="window-bubble" class="pixel-bubble" hidden></div>
    <div id="builder" class="overlay" hidden></div>
    <div id="modal" class="overlay" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
