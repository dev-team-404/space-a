[project]
name = "a-lens-backend"
version = "0.1.0"
description = "A-Lens backend — collects raw data from a-hub (work/life), processes it into view models, serves the spectator UI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["alens*"]
