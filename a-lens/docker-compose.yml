# a-lens 로컬 실행 + 같은 네트워크(LAN) 공유용.
#   docker compose up -d --build   → http://<이 PC의 LAN IP>:8600 을 팀원과 공유
# 주의: a-hub 접속값과 LLM 엔드포인트는 backend/.env(커밋 안 됨)에서 읽는다.
#       LLM 미설정이면 번역·잡담은 규칙 폴백으로 동작한다(.env.example 참고).
services:
  a-lens:
    build:
      context: .
      additional_contexts:
        proxy-certs: ./.proxy-certs # 사내 proxy CA (*.crt) — 없으면 Dockerfile에서 no-op
    image: a-lens:local
    container_name: a-lens
    ports:
      - "8600:8600" # 0.0.0.0 바인딩 → 같은 네트워크에서 http://<host-ip>:8600 접속
    env_file:
      - backend/.env # A_LENS_WORK_URL / A_LENS_WORK_TOKEN / A_LENS_WORK_API_KEY 등
    environment:
      # LLM 엔드포인트는 backend/.env로 지정한다. 컨테이너에서 호스트의 LM Studio를 쓸 때는
      # host.docker.internal이 막히는 환경이 있어 WSL 게이트웨이 IP가 필요할 수 있다.
      - A_LENS_SUMMARY_STYLE=brief
    volumes:
      - alens-data:/app/a-lens/backend/.a-lens # 설정·번역 캐시·스냅숏 영속화
    restart: unless-stopped

volumes:
  alens-data:
