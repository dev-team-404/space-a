[package]
name = "agent-mentor"
version = "0.1.0"
edition = "2021"

[lib]
name = "agent_mentor"
path = "src/lib.rs"

[[bin]]
name = "agent-mentor"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
ureq = { version = "2", features = ["json"] }
anyhow = "1"
sys-locale = "0.3"

[dev-dependencies]
tempfile = "3"
